[workspace]
resolver = "2"
members = [
    "crates/wf-config",
    "crates/wf-data",
    "crates/wf-log",
    "crates/wf-capture",
    "crates/wf-overlay",
    "crates/wf-ocr",
    "crates/wf-gridscan",
    "crates/wf-relic",
    "crates/wf-cache",
    "crates/wf-settings",
    "crates/wf-tray",
    "crates/wf-browse",
    "crates/wf-mem",
]
# Build/test everything by default so a bare `cargo build --release` produces
# the single `wf-lite` binary (tray, overlay, settings, browse, mem-scan all
# linked in — see #68/#69/#70). `wf-mem` was deliberately absent from this
# list under map #55 (kept a workspace member so `cargo build --workspace`
# and its own tests still worked, but excluded from the default build). Map
# #68 (issue #70) reversed that: `wf-mem` is now a default member too,
# matching `mem-scan` becoming part of `wf-lite`'s default feature set (see
# its Cargo.toml) — a bare `cargo build`/`cargo build --release` now links
# the memory-reading code. This is a build-time default only; it does not
# change the consent model — `wf-lite mem-scan` being explicitly invoked
# (ADR-0013) remains the sole consent gate, and `--no-default-features`
# still excludes `mem-scan` for testing (see #58/#67).
#
# `wf-ocr` and `wf-gridscan` were excluded here for the mirror-image reason
# (#71: a bare build needing neither `libtesseract-dev`, `libleptonica-dev`,
# nor `clang`), but the relic reward picker — auto-detecting the post-mission
# reward screen and ranking the 2-4 choices — *is* the app's main point, and
# it's entirely OCR-driven; everything else here is secondary. ADR-0017
# reverses #71: both are default members again, matching `ocr` joining
# `wf-lite`'s default feature set below (mirroring ADR-0016's `mem-scan`
# reversal).
default-members = [
    ".",
    "crates/wf-config",
    "crates/wf-data",
    "crates/wf-log",
    "crates/wf-capture",
    "crates/wf-overlay",
    "crates/wf-ocr",
    "crates/wf-gridscan",
    "crates/wf-relic",
    "crates/wf-cache",
    "crates/wf-settings",
    "crates/wf-tray",
    "crates/wf-browse",
    "crates/wf-mem",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/spirotris/warframe-lite"

[workspace.dependencies]
# Internal crates
wf-config = { path = "crates/wf-config" }
wf-data = { path = "crates/wf-data" }
wf-log = { path = "crates/wf-log" }
wf-capture = { path = "crates/wf-capture" }
wf-overlay = { path = "crates/wf-overlay" }
wf-ocr = { path = "crates/wf-ocr" }
wf-gridscan = { path = "crates/wf-gridscan" }
wf-relic = { path = "crates/wf-relic" }
wf-cache = { path = "crates/wf-cache" }
wf-mem = { path = "crates/wf-mem" }
wf-settings = { path = "crates/wf-settings" }
wf-tray = { path = "crates/wf-tray" }
wf-browse = { path = "crates/wf-browse" }

# Shared third-party
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "net", "io-util"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
directories = "6"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[package]
name = "warframe-lite"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wf-lite"
path = "src/main.rs"

[features]
# Gates the `mem-scan` subcommand and its `wf-mem` dependency. Map #55 kept
# this out of the default build; map #68 (issue #70) reversed that, so
# `mem-scan` now ships in a bare `cargo build`/`cargo build --release` (see
# ADR-0016). The flag itself is kept rather than removed, so
# `--no-default-features` (or `--no-default-features --features mem-scan`)
# still lets tests and CI exercise both configurations (see #58/#67) — and
# so the consent model doesn't change: per ADR-0001/ADR-0013, only running
# `wf-lite mem-scan` itself is consent, never the build-time default.
default = ["mem-scan", "ocr"]
mem-scan = ["dep:wf-mem"]
# Gates OCR (in-process libtesseract/libleptonica FFI, ADR-0008) and
# relic-grid scanning. #71 made this opt-in (mirroring `mem-scan`'s old
# pattern), but the automatic relic reward picker — the app's main point,
# per CONTEXT.md — is entirely OCR-driven: a bare build without this feature
# silently ships an app that can't do the one thing it exists for. ADR-0017
# reverses #71 and puts `ocr` back in the default feature set, so a bare
# `cargo build`/`cargo build --release` links tesseract/leptonica and needs
# `libtesseract-dev`/`libleptonica-dev`/`clang` at build time (see
# `docs/ocr.md` for the per-distro package names) plus the shared libraries
# at runtime. The flag itself is kept (not folded away) so
# `--no-default-features`/`--no-default-features --features mem-scan` can
# still build/test without it, same rationale as `mem-scan` above.
# `wf-gridscan` is folded in here too rather than left half-gated: it's a
# hard dependency of `wf-ocr` (relic-grid scanning *is* OCR), so building it
# without this feature would still force those system deps. `wf-relic/grid-
# scan` enables the OCR-only slice of `wf-relic` (its `regions` module —
# grid coordinates/slot types for the relic-grid and Inventory/Sell
# scanners) that transitively needs `wf-gridscan`; the rest of `wf-relic`
# (catalogue, mastery, pricing, etc.) stays available either way since
# `wf-relic` itself remains an unconditional dependency below. Every OCR-
# dependent CLI command (`ocr`, `ocr-file`, `relic-file`, `relic-scan`,
# `relic-grid-file`, `inventory-grid-file`) and the live overlay's reward-
# picker auto-detection route through `src/ocr_enabled.rs` when this feature
# is on, or `src/ocr_disabled.rs`'s friendly "rebuild without
# `--no-default-features`" stand-in otherwise (see `src/main.rs`'s
# `mod ocr;`) — that stand-in now only matters for `--no-default-features`
# builds.
ocr = ["dep:wf-ocr", "dep:wf-gridscan", "wf-relic/grid-scan"]

[dependencies]
wf-config.workspace = true
wf-data.workspace = true
wf-log.workspace = true
wf-capture.workspace = true
wf-overlay.workspace = true
wf-ocr = { workspace = true, optional = true }
wf-gridscan = { workspace = true, optional = true }
wf-relic.workspace = true
wf-cache.workspace = true
wf-mem = { workspace = true, optional = true }
# The tray/browse subsystems, linked in so `wf-lite`'s `tray` (and its
# default bare invocation) and `browse` subcommands run them in-process
# instead of spawning separately-installed sibling binaries (see #69). Their
# own `[[bin]]` targets stay for standalone dev/embedding builds (`cargo run
# -p wf-tray`, etc.) — see the map (#68). `wf-settings` is deliberately not
# listed here (#72): its standalone settings window was folded into
# `wf-browse`'s tab bar as a Settings tab, so nothing in this binary calls
# `wf_settings::run()` anymore (`wf-lite`'s `settings` subcommand is now a
# harmless alias for `browse`, see `src/main.rs`). `wf-settings` itself stays
# a workspace member — a standalone, independently buildable/testable crate
# for dev/embedding (`cargo run -p wf-settings`, `cargo test -p
# wf-settings`) — just no longer wired into the shipped binary.
wf-tray.workspace = true
wf-browse.workspace = true
reqwest.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
image.workspace = true
# Formats `mem-scan`'s Foundry completion ETAs and builds the overlay's
# demo-mode synthetic Fissure timestamps (see `spawn_control_listener`'s
# `demo-on`/`demo-off` handling) — both unconditional now, so this is no
# longer feature-gated.
time.workspace = true
