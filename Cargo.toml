[workspace]
resolver = "2"
members = [
    "crates/wf-config",
    "crates/wf-data",
    "crates/wf-log",
    "crates/wf-capture",
    "crates/wf-overlay",
    "crates/wf-ocr",
    "crates/wf-relic",
    "crates/wf-cache",
    "crates/wf-settings",
    "crates/wf-tray",
    "crates/wf-browse",
]
# Build/test everything by default so a bare `cargo build --release` produces all
# four binaries (wf-lite + the wf-tray/wf-settings/wf-browse companions), not just
# wf-lite.
default-members = [
    ".",
    "crates/wf-config",
    "crates/wf-data",
    "crates/wf-log",
    "crates/wf-capture",
    "crates/wf-overlay",
    "crates/wf-ocr",
    "crates/wf-relic",
    "crates/wf-cache",
    "crates/wf-settings",
    "crates/wf-tray",
    "crates/wf-browse",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/spirotris/warframe-lite"

[workspace.dependencies]
# Internal crates
wf-config = { path = "crates/wf-config" }
wf-data = { path = "crates/wf-data" }
wf-log = { path = "crates/wf-log" }
wf-capture = { path = "crates/wf-capture" }
wf-overlay = { path = "crates/wf-overlay" }
wf-ocr = { path = "crates/wf-ocr" }
wf-relic = { path = "crates/wf-relic" }
wf-cache = { path = "crates/wf-cache" }

# Shared third-party
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "net", "io-util"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
directories = "6"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[package]
name = "warframe-lite"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wf-lite"
path = "src/main.rs"

[dependencies]
wf-config.workspace = true
wf-data.workspace = true
wf-log.workspace = true
wf-capture.workspace = true
wf-overlay.workspace = true
wf-ocr.workspace = true
wf-relic.workspace = true
wf-cache.workspace = true
reqwest.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
image.workspace = true
