[workspace]
resolver = "2"
members = [
    "crates/wf-config",
    "crates/wf-data",
    "crates/wf-log",
    "crates/wf-capture",
    "crates/wf-overlay",
    "crates/wf-ocr",
    "crates/wf-gridscan",
    "crates/wf-relic",
    "crates/wf-cache",
    "crates/wf-settings",
    "crates/wf-tray",
    "crates/wf-browse",
    "crates/wf-mem",
]
# Build/test everything by default so a bare `cargo build --release` produces all
# four binaries (wf-lite + the wf-tray/wf-settings/wf-browse companions), not just
# wf-lite. `wf-mem` is deliberately absent — it's a workspace member (so
# `cargo build --workspace` and its own tests still work) but not a default one,
# so a bare `cargo build`/`cargo build --release` never links the memory-reading
# code; only `cargo build --features mem-scan` on `wf-lite` does (see its
# Cargo.toml and CLAUDE.md/#55's Notes).
default-members = [
    ".",
    "crates/wf-config",
    "crates/wf-data",
    "crates/wf-log",
    "crates/wf-capture",
    "crates/wf-overlay",
    "crates/wf-ocr",
    "crates/wf-gridscan",
    "crates/wf-relic",
    "crates/wf-cache",
    "crates/wf-settings",
    "crates/wf-tray",
    "crates/wf-browse",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/spirotris/warframe-lite"

[workspace.dependencies]
# Internal crates
wf-config = { path = "crates/wf-config" }
wf-data = { path = "crates/wf-data" }
wf-log = { path = "crates/wf-log" }
wf-capture = { path = "crates/wf-capture" }
wf-overlay = { path = "crates/wf-overlay" }
wf-ocr = { path = "crates/wf-ocr" }
wf-gridscan = { path = "crates/wf-gridscan" }
wf-relic = { path = "crates/wf-relic" }
wf-cache = { path = "crates/wf-cache" }
wf-mem = { path = "crates/wf-mem" }

# Shared third-party
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "net", "io-util"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
directories = "6"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[package]
name = "warframe-lite"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wf-lite"
path = "src/main.rs"

[features]
# Gates the `mem-scan` subcommand and its `wf-mem` dependency out of the
# default build entirely (see ADR-0001/ADR-0013 and #55's Notes) — not in
# the default feature set, so a bare `cargo build`/`cargo build --release`
# never links the memory-reading code.
mem-scan = ["dep:wf-mem", "dep:time"]

[dependencies]
wf-config.workspace = true
wf-data.workspace = true
wf-log.workspace = true
wf-capture.workspace = true
wf-overlay.workspace = true
wf-ocr.workspace = true
wf-gridscan.workspace = true
wf-relic.workspace = true
wf-cache.workspace = true
wf-mem = { workspace = true, optional = true }
reqwest.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
image.workspace = true
# Only used to format `mem-scan`'s Foundry completion ETAs; kept optional so
# it doesn't join the default build's dependency set.
time = { workspace = true, optional = true }
