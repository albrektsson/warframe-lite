[package]
name = "wf-browse"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wf-browse"
path = "src/main.rs"

[dependencies]
wf-config.workspace = true
wf-data.workspace = true
wf-relic.workspace = true
wf-cache.workspace = true
# For the Home tab's Scan Memory button (#72): runs the mem-scan pipeline
# in-process, the same way `wf-lite`'s own `mem-scan` subcommand does — see
# `home_tab`/`spawn_scan` in `src/lib.rs`.
wf-mem.workspace = true
futures.workspace = true
reqwest.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
# Same feature set as wf-settings: glow backend keeps the GUI pure-Rust with no
# system GTK/Qt dev dependency; winit/glutin dlopen libxkbcommon / libGL /
# libwayland at runtime.
eframe = { version = "0.35", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
# Decodes the bundled window-icon PNG (same mark as wf-tray) into egui's RGBA
# IconData.
image.workspace = true
