[package]
name = "wf-ocr"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Exposes Ocr::empty_for_test() outside this crate, for other crates' tests
# (e.g. wf-gridscan's) that need a stub Ocr without linking libtesseract.
test-util = []

[dependencies]
anyhow.workspace = true
tracing.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
# In-process FFI bindings to libtesseract/leptonica (ADR-0008) — no subprocess
# spawn per recognition call. Needs `libtesseract-dev`, `libleptonica-dev`, and
# `clang` (for its bindgen build step) at build time only.
leptess = "0.14"
