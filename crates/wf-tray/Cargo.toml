[package]
name = "wf-tray"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wf-tray"
path = "src/main.rs"

[dependencies]
wf-capture.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# "signal" (SIGTERM/SIGINT handling, see `run`'s cleanup task) on top of the
# workspace-wide feature set.
tokio = { workspace = true, features = ["signal"] }
# PR_SET_PDEATHSIG (see `spawn_self`) so the supervised `overlay` child dies
# with the tray even if the tray itself never runs any cleanup code (SIGKILL,
# a crash, etc).
libc.workspace = true
# StatusNotifierItem tray via DBus (KDE Plasma). ksni 0.3 is pure-Rust (zbus),
# so it adds no system dbus/link dependency.
ksni = "0.3"
# Decodes the bundled tray-icon PNG into ksni's ARGB32 pixmap, so the icon
# travels inside the binary rather than depending on an installed icon theme.
image.workspace = true
