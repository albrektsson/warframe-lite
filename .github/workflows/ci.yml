name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"

env:
  CARGO_TERM_COLOR: always

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (native)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            *.archive.ubuntu.com:80
            dl.google.com:443
            esm.ubuntu.com:443
            github.com:443
            index.crates.io:443
            packages.microsoft.com:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # ratchet:step-security/dtolnay-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # ratchet:Swatinem/rust-cache@v2
      # wf-overlay links libwayland-client via smithay-client-toolkit; the
      # wf-settings GUI (eframe/winit) also wants libxkbcommon at build. wf-ocr
      # links libtesseract/libleptonica in-process via `leptess` (ADR-0008);
      # clang backs its bindgen build step.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libtesseract-dev libleptonica-dev clang
      - name: cargo test
        run: cargo test --locked --workspace
      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # ratchet:taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete
      - name: cargo deny check
        run: cargo deny check
      - name: cargo machete
        run: cargo machete

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            *.archive.ubuntu.com:80
            dl.google.com:443
            esm.ubuntu.com:443
            github.com:443
            index.crates.io:443
            packages.microsoft.com:443
            static.crates.io:443
            static.rust-lang.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # ratchet:step-security/dtolnay-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # ratchet:Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libtesseract-dev libleptonica-dev clang
      - name: cargo build (release)
        run: cargo build --locked --release -p warframe-lite
