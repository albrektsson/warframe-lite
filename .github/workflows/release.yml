name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  build:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # ratchet:step-security/dtolnay-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # ratchet:Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev
      - name: cargo build (release)
        run: cargo build --locked --release -p warframe-lite
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # ratchet:taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Generate release notes
        # Most commits land directly on main rather than through PRs, so
        # git-cliff builds notes from the raw commit log (see cliff.toml)
        # instead of `gh release create --generate-notes` (PR-only).
        run: git-cliff --latest --tag "${{ github.ref_name }}" --output release-notes.md
      - name: Create release with binary attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --notes-file release-notes.md target/release/wf-lite
